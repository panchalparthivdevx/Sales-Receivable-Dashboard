    <div id="root"></div>
<style id="tds-inject-css">

/* ── 1. Hide all nav-tab buttons except the first one (Import) ──── */
header > div:nth-child(2) > button:not(:first-child) {
  display: none !important;
}

/* ── 2. Hide the Reset Session button (now in overflow menu) ─────── */
header button[title="Clear all data and start new session"] {
  display: none !important;
}

/* ── 3. Dark-mode CSS variable overrides ────────────────────────── */
html[data-theme="dark"] {
  --paper:       #0f1117;
  --white:       #1e2230;
  --ink:         #e2e8f0;
  --ink-80:      #cbd5e1;
  --ink-60:      #94a3b8;
  --ink-40:      #64748b;
  --ink-20:      #475569;
  --ink-10:      #334155;
  --ink-05:      #1e293b;
  --border:      #334155;
  --teal-light:  #0f2c29;
  --amber-light: #2c1e09;
  --red-light:   #2c0f0f;
  --green-light: #0f2c17;
  --blue-light:  #0f1a2c;
}

/* ── 4. Injected controls container (uses flex order to sort self) ── */
#tds-inject-wrap {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
  order: 1;
}

/* ── 5. Icon buttons (theme toggle + ⋮ trigger) ─────────────────── */
.tds-ctrl-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  background: transparent;
  border: 1px solid rgba(255,255,255,0.13);
  border-radius: 5px;
  color: rgba(255,255,255,0.48);
  cursor: pointer;
  transition: background 0.1s, color 0.1s, border-color 0.1s;
  padding: 0;
  line-height: 1;
}
.tds-ctrl-btn:hover {
  background: rgba(255,255,255,0.09);
  border-color: rgba(255,255,255,0.22);
  color: #fff;
}
.tds-ctrl-btn:active { background: rgba(255,255,255,0.14); }

/* ── 6. Overflow dropdown ─────────────────────────────────────────── */
#tds-overflow-dd {
  display: none;
  position: absolute;
  top: calc(100% + 7px);
  right: 0;
  min-width: 200px;
  background: #1a2335;
  border: 1px solid rgba(255,255,255,0.13);
  border-radius: 8px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.55);
  z-index: 99999;
  overflow: hidden;
  padding: 4px 0;
}
#tds-overflow-dd.open { display: block; }

.tds-dd-item {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 8px 14px;
  background: none;
  border: none;
  color: #b8c4d4;
  font-size: 12.5px;
  font-family: 'IBM Plex Sans', sans-serif;
  font-weight: 500;
  cursor: pointer;
  text-align: left;
  transition: background 0.08s, color 0.08s;
  white-space: nowrap;
}
.tds-dd-item:hover:not([disabled]) {
  background: rgba(255,255,255,0.07);
  color: #fff;
}
.tds-dd-item[disabled] { opacity: 0.35; cursor: default; }
.tds-dd-item.tds-danger { color: #f87171; }
.tds-dd-item.tds-danger:hover:not([disabled]) {
  background: rgba(248,113,113,0.09);
  color: #fc8181;
}
.tds-dd-sep {
  height: 1px;
  background: rgba(255,255,255,0.08);
  margin: 3px 8px;
}
.tds-dd-icon {
  width: 14px; height: 14px;
  flex-shrink: 0;
  opacity: 0.72;
  display: flex; align-items: center; justify-content: center;
}
</style>

<script id="tds-inject-js">
(function () {
  'use strict';

  /* ── Apply saved theme before first paint ───────────────────────── */
  if (localStorage.getItem('tds-theme') === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
  }

  /* ── Inline SVG icons ────────────────────────────────────────────── */
  var SVG = {
    sun:     '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>',
    moon:    '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>',
    dots:    '<svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>',
    edit:    '<svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>',
    chart:   '<svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>',
    table:   '<svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/></svg>',
    file:    '<svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>',
    filter:  '<svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>',
    warn:    '<svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
    users:   '<svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
    lock:    '<svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>',
    info:    '<svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>',
    refresh: '<svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.28"/></svg>',
  };

  /* ── Overflow menu definition ─────────────────────────────────────── */
  var MENU = [
    { label: 'Books Entry',      tid: 'books-entry', icon: 'edit'    },
    { label: 'Dashboard',        tid: 'dashboard',   icon: 'chart'   },
    { label: 'Books vs Portal',  tid: 'recon',       icon: 'table'   },
    { label: 'Extracted Data',   tid: 'extracted',   icon: 'file'    },
    { label: 'Vendor Summary',   tid: 'vendor',      icon: 'filter'  },
    { label: 'Mismatches',       tid: 'mismatch',    icon: 'warn'    },
    { label: 'User Mgmt',        tid: 'admin',       icon: 'users',  adminOnly: true },
    { label: 'Password',         tid: 'change-pwd',  icon: 'lock'    },
    { label: 'About',            tid: 'about',       icon: 'info'    },
    { sep: true },
    { label: 'Reset Session',    tid: 'reset',       icon: 'refresh', danger: true },
  ];

  /* ── Tag the React-rendered tab buttons so we can find them ──────── */
  function tagTabButtons() {
    var strip = document.querySelector('header > div:nth-child(2)');
    if (!strip) return false;
    var btns = strip.querySelectorAll('button');
    if (!btns.length) return false;
    /* Order must match te[] in the bundle:
       import · books-entry · dashboard · recon · extracted
       · vendor · mismatch · [admin if present] · change-pwd · about */
    var ids = ['import','books-entry','dashboard','recon',
               'extracted','vendor','mismatch'];
    if (btns.length >= 10) ids.push('admin');
    ids.push('change-pwd', 'about');
    for (var i = 0; i < btns.length && i < ids.length; i++) {
      if (!btns[i].getAttribute('data-tid')) {
        btns[i].setAttribute('data-tid', ids[i]);
      }
    }
    return true;
  }

  /* ── Look up a tab button by its data-tid attribute ──────────────── */
  function findTab(tid) {
    return document.querySelector(
      'header > div:nth-child(2) button[data-tid="' + tid + '"]'
    );
  }

  /* ── Rebuild dropdown contents each time it opens ────────────────── */
  function buildDropdown(dd) {
    dd.innerHTML = '';
    MENU.forEach(function (item) {
      if (item.sep) {
        var sep = document.createElement('div');
        sep.className = 'tds-dd-sep';
        dd.appendChild(sep);
        return;
      }
      /* Skip admin entry when the user has no admin role (button absent) */
      if (item.adminOnly && !findTab('admin')) return;

      var btn = document.createElement('button');
      btn.className = 'tds-dd-item' + (item.danger ? ' tds-danger' : '');

      /* Mirror the disabled state from the underlying tab */
      if (item.tid !== 'reset') {
        var el = findTab(item.tid);
        if (el && el.disabled) btn.setAttribute('disabled', '');
      }

      btn.innerHTML =
        '<span class="tds-dd-icon">' + (SVG[item.icon] || '') + '</span>' +
        item.label;

      /* Capture tid in closure for the click handler */
      btn.addEventListener('click', (function (tid, isReset) {
        return function () {
          dd.classList.remove('open');
          if (isReset) {
            var resetEl = document.querySelector(
              'header button[title="Clear all data and start new session"]'
            );
            if (resetEl) resetEl.click();
          } else {
            var freshTab = findTab(tid);
            if (freshTab && !freshTab.disabled) freshTab.click();
          }
        };
      })(item.tid, item.tid === 'reset'));

      dd.appendChild(btn);
    });
  }

  /* ── Build and attach the toolbar controls ───────────────────────── */
  function inject() {
    if (document.getElementById('tds-inject-wrap')) return;

    var header = document.querySelector('header');
    if (!header || header.children.length < 3) return;

    var rightSection = header.children[2];
    var userBadge    = rightSection.lastElementChild;
    if (!userBadge) return;

    if (!tagTabButtons()) return;  /* tabs not in DOM yet */

    /* Push user badge after our controls using flex order */
    userBadge.style.order = '2';

    /* ── Theme toggle ─────────────────────────────────────────────── */
    var themeBtn = document.createElement('button');
    themeBtn.className = 'tds-ctrl-btn';
    themeBtn.title = 'Toggle light / dark mode';

    function syncThemeIcon() {
      var dark = document.documentElement.getAttribute('data-theme') === 'dark';
      themeBtn.innerHTML = dark ? SVG.sun : SVG.moon;
    }
    syncThemeIcon();

    themeBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      if (isDark) {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('tds-theme', 'light');
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('tds-theme', 'dark');
      }
      syncThemeIcon();
    });

    /* ── Overflow (⋮) trigger + dropdown ─────────────────────────── */
    var overWrap = document.createElement('div');
    overWrap.style.cssText = 'position:relative;display:flex;align-items:center;';

    var overBtn = document.createElement('button');
    overBtn.className = 'tds-ctrl-btn';
    overBtn.id        = 'tds-overflow-btn';
    overBtn.title     = 'More options';
    overBtn.innerHTML = SVG.dots;

    var dd = document.createElement('div');
    dd.id = 'tds-overflow-dd';

    overBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      var opening = !dd.classList.contains('open');
      dd.classList.remove('open');
      if (opening) {
        buildDropdown(dd);       /* refresh disabled states on each open */
        dd.classList.add('open');
      }
    });

    document.addEventListener('click', function () {
      dd.classList.remove('open');
    });

    overWrap.appendChild(overBtn);
    overWrap.appendChild(dd);

    /* ── Assemble and APPEND (not insertBefore) — safe from React ─── */
    var wrap = document.createElement('div');
    wrap.id = 'tds-inject-wrap';
    wrap.appendChild(themeBtn);
    wrap.appendChild(overWrap);

    rightSection.appendChild(wrap);
  }

  /* ── Poll until React mounts the header, then inject ─────────────── */
  var pollId = setInterval(function () {
    var hdr = document.querySelector('header');
    if (hdr && hdr.children[2] && hdr.children[2].lastElementChild) {
      clearInterval(pollId);
      inject();

      /* Re-inject if React ever removes our element; re-tag on any update */
      new MutationObserver(function () {
        if (!document.getElementById('tds-inject-wrap')) {
          inject();
        } else {
          tagTabButtons();
        }
      }).observe(hdr, { childList: true, subtree: true });
    }
  }, 80);

})();
</script>

</body></html>
