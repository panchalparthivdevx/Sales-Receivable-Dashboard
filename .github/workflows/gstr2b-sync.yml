# GSTR-2B Reco: automatic Zoho Books sync for the online dashboard (the office PC syncs by itself; Vercel has no timers).
#
# Every 15 minutes in the working day this asks the dashboard to read what changed in Zoho Books (new, edited and voided bills,
# vendor credits and GST expenses) and to fetch the GST amounts of whatever is still waiting; once a night it also checks for
# documents deleted in Zoho. Nothing is written to Zoho. Each call is one "step" of up to 3 minutes; while a first fill is in
# progress a scheduled run does up to 3 steps, and "Run workflow" (drain) keeps going until the work is done or the day's budget is used.
#
# Uses the same two repository secrets as scheduled-sync.yml (Settings → Secrets and variables → Actions):
#   APP_URL      the dashboard's address
#   CRON_SECRET  the same value as CRON_SECRET in the Vercel project
# Until APP_URL is set the job does nothing. The first sync must be started on the page (Imports & sync → Start the first sync…):
# a company that has had no first sync yet is skipped.
name: GSTR-2B Zoho sync

on:
  schedule:
    - cron: '7,22,37,52 3-17 * * *'    # every 15 min, 8:37 AM – 11:22 PM IST (minutes chosen to miss the dashboard's own :00 / :30 syncs)
    - cron: '30 19 * * *'              # 1:00 AM IST — the same, plus the check for documents deleted in Zoho
  workflow_dispatch:                   # "Run workflow": finish the first fill without keeping a page open
    inputs:
      drain:
        description: 'Keep going until the work is done or paused (first fill: up to about 2 hours)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: gstr2b-sync
  cancel-in-progress: false

jobs:
  call:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    env:
      APP_URL: ${{ secrets.APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      SCHEDULE: ${{ github.event.schedule }}
      DRAIN: ${{ github.event.inputs.drain }}
    steps:
      - name: Call the dashboard
        if: env.APP_URL != ''
        run: |
          set -u
          mode=incremental
          [ "$SCHEDULE" = "30 19 * * *" ] && mode=recheck
          max=3
          [ "$DRAIN" = "true" ] && max=45
          for i in $(seq 1 "$max"); do
            code=$(curl -sS --max-time 320 -o response.json -w '%{http_code}' -H "Authorization: Bearer $CRON_SECRET" "${APP_URL%/}/api/cron/gstr2b?mode=$mode" || echo 000)
            out=$(cat response.json 2>/dev/null || true)
            if [ "$code" = "401" ]; then echo "::error::The dashboard refused the CRON_SECRET (401): it must be the same value as CRON_SECRET in the Vercel project"; exit 1; fi
            if [ "$code" != "200" ]; then echo "::warning::step $i: HTTP $code $out"; break; fi
            echo "step $i: $out"
            echo "$out" | grep -q '"more":true' || break
            sleep "${STEP_PAUSE:-5}"
          done
